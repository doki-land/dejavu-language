[workspace]
resolver = "3"
members = [
    "dejavu",
    "dejavu-runtime",
    "dejavu-config",
    "dejavu-engine",
    "dejavu-ir",
    "dejavu-language",
    "dejavu-macros",
    "dejavu-tools",
    "dejavu-types",
    "axum-dejavu",
]
default-members = [
    "dejavu",
    "dejavu-runtime",
    "dejavu-config",
    "dejavu-engine",
    "dejavu-ir",
    "dejavu-language",
    "dejavu-macros",
    "dejavu-tools",
    "dejavu-types",
    "axum-dejavu",
]

[workspace.package]
version = "0.0.1"
authors = ["Yggdrasill Team <192607617@qq.com>"]
edition = "2024"
license = "MPL-2.0"
homepage = "https://github.com/doki-land/dejavu-engine"
repository = "https://github.com/doki-land/dejavu-engine"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"
toml = "1.0.7"
toml_edit = "0.25.5"
figment = { version = "0.10.19", features = ["toml", "env"] }
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt", "macros"] }
once_cell = "1.19"
bincode = "1.3.3"
regex = "1.10.4"
glob = "0.3.1"
fluent = "0.16.0"
fluent-syntax = "0.11.0"
fluent-bundle = "0.15.0"
unic-langid = "0.9.0"
lru = "0.7.0"
futures = "0.3"
tracing = "0.1.44"
arcstr = "1.2.0"
indexmap = "2.13.0"
im-rc = "15.1.0"
num = "0.4.3"
bigdecimal = "0.4.10"
unicode-ident = "1.0.24"
miette = "7"

dejavu = { path = "dejavu", version = "0.0.1" }
dejavu-runtime = { path = "dejavu-runtime", version = "0.0.1" }
dejavu-engine = { path = "dejavu-engine", version = "0.0.1" }
dejavu-types = { path = "dejavu-types", version = "0.0.1" }
dejavu-config = { path = "dejavu-config", version = "0.0.1" }
dejavu-macros = { path = "dejavu-macros", version = "0.0.1" }
dejavu-tools = { path = "dejavu-tools", version = "0.0.1" }
dejavu-ir = { path = "dejavu-ir", version = "0.0.1" }
dejavu-language = { path = "dejavu-language", version = "0.0.1" }
axum-dejavu = { path = "axum-dejavu", version = "0.0.1" }

[profile.release]
lto = true
panic = "abort"

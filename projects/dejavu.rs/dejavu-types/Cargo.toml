[package]
name = "dejavu-types"
publish = false
version.workspace = true
authors.workspace = true
description = "Core type definitions, values, and runtime utilities for Dejavu"
license.workspace = true
repository = "https://github.com/doki-land/dejavu-engine/tree/dev/projects/dejavu.rs/dejavu-types"
exclude = ["/tests/*"]
edition.workspace = true
autotests = false

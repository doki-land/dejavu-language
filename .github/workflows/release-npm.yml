# Publish @doki-land/dejavu TypeScript CLI — platform N-API addons + meta package
# via OIDC Trusted Publishing (configured per-package on npmjs.com).
#
# Package naming: @doki-land/dejavu-<os>-<cpu> (no -cli prefix, no -gnu/-musl suffix).
#   Mirrors @doki-land/nifty exactly. Published versions are >0.0.0
#   (0.0.0 is the Trusted Publishing placeholder).
#
# Flow:
#   tag → ci → build (matrix: linux/ubuntu, darwin/macos, win32/windows) → publish (ubuntu)
# Trigger: push tag v*  or  workflow_dispatch
# Repo: doki-land/dejavu-language
#
# npm Trusted Publisher env used by CI: (none needed — OIDC via GITHUB_TOKEN)

name: release-npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no leading v). Use >0.0.0 after stubs."
        required: true
        default: "0.0.1"

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ──────────────────────────────────────────────────────────
  # CI 门控
  # ──────────────────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────────────────────
  # 版本解析
  # ──────────────────────────────────────────────────────────
  resolve-version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Version must be X.Y.Z (got: $VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

  # ──────────────────────────────────────────────────────────
  # 6 平台 N-API 构建（matrix，fail-fast 关闭）
  # ──────────────────────────────────────────────────────────
  build-native:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 宿主机原生编译
          - host: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - host: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - host: darwin-arm64
            os: macos-latest           # Apple Silicon (M1+)
            rust_target: aarch64-apple-darwin
          - host: darwin-x64
            os: macos-latest           # cross-compile x86_64-apple-darwin on Apple Silicon runner (Tier 2 + Clang)
            rust_target: x86_64-apple-darwin
          - host: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - host: win32-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch 直接用 dev（已 resolve-version 处理过 tag 情况）
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS arm64 runner cross-compiles both darwin-arm64 and darwin-x64,
          # so we need both targets installed on any macOS job.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build N-API addon
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build/napi.mjs --release --target ${{ matrix.rust_target }}
          ls -la "compilers/dejavu/npm/${{ matrix.host }}/"

      - name: Upload platform addon
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-${{ matrix.host }}
          path: compilers/dejavu/npm/${{ matrix.host }}/dejavu.*.node
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # 发布（ubuntu-latest，bash 脚本 + OIDC 有权限）
  # ──────────────────────────────────────────────────────────
  publish:
    needs: [resolve-version, build-native]
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref }}

      - name: Install pnpm (must precede setup-node with pnpm cache)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: npm CLI for OIDC provenance
        run: npm install -g npm@^11.5.1

      - name: Build TypeScript packages
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm --filter @doki-land/dejavu-engine build
          pnpm --filter @doki-land/dejavu build
          test -f projects/packages/dejavu-engine/dist/index.js
          test -f projects/packages/dejavu-engine/dist/runtime/index.js
          test -f projects/packages/dejavu/dist/index.js
          test -f projects/packages/dejavu/dist/cli.js

      - name: Download all 6 platform addons
        uses: actions/download-artifact@v4
        with:
          pattern: dejavu-*
          path: artifacts
          merge-multiple: false

      # ──────────── Stage addons into platform packages ────────────
      - name: Stage addons + pin versions
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/set-release-version.mjs "$VERSION"

          expected=$(find artifacts -maxdepth 1 -type d -name 'dejavu-*' | wc -l)
          staged=0
          for dir in artifacts/dejavu-*; do
            [ -d "$dir" ] || continue
            host="${dir#artifacts/dejavu-}"
            npm_dir="$(node --input-type=module -e "
              import { findPlatformByHost, nodeFileName } from './scripts/dejavu-release-packages.mjs';
              const p = findPlatformByHost(process.argv[1]);
              if (!p) { console.error('unknown host', process.argv[1]); process.exit(2); }
              console.log('compilers/dejavu/npm/' + p.npmDir + '/' + nodeFileName(p));
            " "$host")"
            test -d "$(dirname "$npm_dir")"

            addon="$(find "$dir" -maxdepth 1 -type f -name '*.node' | head -n1)"
            test -n "$addon"
            cp "$addon" "$npm_dir"
            echo "staged $host → $npm_dir"
            staged=$((staged + 1))
          done

          echo "staged $staged / $expected"
          [ "$staged" -eq "$expected" ]

      # ──────────── npm publish（所有包，带 provenance） ────────────
      - name: Publish all packages
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail

          publish_one() {
            local dir="$1"
            local name version out status
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            echo "::group::npm publish ${name}@${version}"
            set +e
            out="$(cd "$dir" && npm publish --access public --provenance 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$out"
            if [ "$status" -eq 0 ]; then
              echo "published ${name}@${version}"
              echo "::endgroup::"
              return 0
            fi
            if printf '%s\n' "$out" | grep -Eqi \
              'cannot publish over|previously published|EPUBLISHCONFLICT'; then
              echo "::notice::${name}@${version} already on npm — skip"
              echo "::endgroup::"
              return 0
            fi
            echo "::error::npm publish failed for ${name}@${version}"
            echo "::endgroup::"
            return "$status"
          }

          # 1) Platform packages first
          failed=0
          for d in compilers/dejavu/npm/*/; do
            pkg="${d%/}"
            name="$(node -p "require('./${pkg}/package.json').name")"
            if ls "$pkg"/dejavu*.node >/dev/null 2>&1; then
              publish_one "$pkg" || failed=1
            else
              echo "::warning::skip $name (no staged addon)"
            fi
          done

          # 2) Runtime engine @doki-land/dejavu-engine (pure TS AOT runtime, no native addon)
          publish_one projects/packages/dejavu-engine || failed=1

          # 3) Meta-package @doki-land/dejavu (TypeScript CLI + N-API facade)
          PKG=projects/packages/dejavu
          node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          const file = "projects/packages/dejavu/package.json";
          const j = JSON.parse(fs.readFileSync(file, "utf8"));
          j.version = version;
          if (j.optionalDependencies) {
            for (const k of Object.keys(j.optionalDependencies)) {
              j.optionalDependencies[k] = version;
            }
          }
          fs.writeFileSync(file, JSON.stringify(j, null, 2) + "\n");
          console.log(`${j.name}@${j.version}`);
          NODE
          publish_one "$PKG" || failed=1

          exit "$failed"

# Publish @doki-land/dejavu (TS API) + Rust CLI platform packages
# when a semver tag is pushed. Trusted Publisher on npmjs.com.
#
# Platform names: @doki-land/dejavu-<os>-<cpu> (no -cli prefix, no -gnu/-musl suffix).
# Mirrors @doki-land/nifty naming exactly.
#
# Flow: tag → ci → publish (build linux-x64 in ubuntu, publish all configured platforms + TS API)
# Trigger: tag vX.Y.Z
# Repo: doki-land/dejavu-language

name: release-npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch ref (default: v0.0.1)"
        required: false
        default: "v0.0.1"

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ──────────────────────────────────────────────────────────
  # CI 门控（复用 ci.yml）
  # ──────────────────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────────────────────
  # 发布（ci 通过后 publish）
  # ──────────────────────────────────────────────────────────
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Ensure npm CLI for OIDC
        run: npm install -g npm@^11.5.1

      - name: Install Rust toolchain (linux-gnu target covers linux-x64 platform pkg)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z (got: $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      # ──────────── Rust CLI binary build ────────────
      # Linux 64-bit on ubuntu-latest covers the first real platform publish.
      # Other platforms cross-compile (darwin/windows) or run on dedicated runners later.
      - name: Build Rust CLI (linux-x64)
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          cargo build --release -p dejavu-tools --bin dejavu --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/dejavu dist-bin/dejavu-linux-x64
          chmod +x dist-bin/dejavu-linux-x64
          ls -la dist-bin/

      # ──────────── Stage + version pin ────────────
      - name: Stage binaries + pin versions
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/set-release-version.mjs "$VERSION"
          cp dist-bin/dejavu-linux-x64 compilers/dejavu/npm/linux-x64/dejavu
          echo "staged linux-x64 → compilers/dejavu/npm/linux-x64/dejavu"

      # ──────────── TS API build ────────────
      - name: Build @doki-land/dejavu (TS API)
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm --filter @doki-land/dejavu run build:publish

      # ──────────── npm publish（所有包，带 provenance） ────────────
      - name: Publish all packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          publish_one() {
            local dir="$1"
            local name version out status
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            echo "::group::npm publish ${name}@${version}"
            set +e
            out="$(cd "$dir" && npm publish --access public --provenance 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$out"
            if [ "$status" -eq 0 ]; then
              echo "published ${name}@${version}"
              echo "::endgroup::"
              return 0
            fi
            if printf '%s\n' "$out" | grep -Eqi \
              'cannot publish over|previously published|EPUBLISHCONFLICT'; then
              echo "::notice::${name}@${version} already on npm — skip"
              echo "::endgroup::"
              return 0
            fi
            echo "::error::npm publish failed for ${name}@${version}"
            echo "::endgroup::"
            return "$status"
          }

          # 1) Platform packages first
          failed=0
          for d in compilers/dejavu/npm/*/; do
            pkg="${d%/}"
            name="$(node -p "require('./${pkg}/package.json').name")"
            if ls "$pkg"/dejavu* >/dev/null 2>&1; then
              publish_one "$pkg" || failed=1
            else
              echo "::warning::skip $name (no staged binary)"
            fi
          done

          # 2) TS API + optionalDeps facade @doki-land/dejavu
          PKG=projects/packages/dejavu
          node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          const file = "projects/packages/dejavu/package.json";
          const j = JSON.parse(fs.readFileSync(file, "utf8"));
          j.version = version;
          if (j.optionalDependencies) {
            for (const k of Object.keys(j.optionalDependencies)) {
              j.optionalDependencies[k] = version;
            }
          }
          j.main = "./dist/index.js";
          j.types = "./dist/index.d.ts";
          j.exports = { ".": { types: "./dist/index.d.ts", import: "./dist/index.js" } };
          j.publishConfig = { ...(j.publishConfig || {}), access: "public" };
          j.repository = {
            type: "git",
            url: "git+https://github.com/doki-land/dejavu-language.git",
            directory: "projects/packages/dejavu",
          };
          j.homepage = "https://github.com/doki-land/dejavu-language";
          delete j.private;
          fs.writeFileSync(file, JSON.stringify(j, null, 2) + "\n");
          console.log(`${j.name}@${j.version}`);
          NODE
          publish_one "$PKG" || failed=1

          exit "$failed"

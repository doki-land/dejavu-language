# Rust gate for dejavu-language.
# - push / PR on any branch → regular CI only (no publish)
# - release-npm calls this via workflow_call on tag vX.Y.Z
# - On workflow_call, checkout is the caller's ref (the tagged commit)
#
# Scope: Rust workspace only. The TypeScript pipeline (N-API addon build, typecheck,
# tests, AOT runtime build, IR conformance) lives in `check-typescript.yml`.
# Both gates are required by the npm release; a green Rust gate does not prove
# the JS surface builds or that conformance holds.

name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: ci-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Rust workspace tests
        run: cargo test --workspace

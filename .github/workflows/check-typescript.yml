# TypeScript gate for dejavu-language.
# - push / PR on any branch → regular CI only (no publish)
# - release-npm calls this via workflow_call on tag vX.Y.Z
# - On workflow_call, checkout is the caller's ref (the tagged commit)
#
# Scope: the publishable JS surface. It builds the N-API addon from the Rust
# sources (so it still needs a Rust toolchain) and then typechecks, tests,
# builds the facade and AOT runtime, and runs IR conformance.
# Rust unit/integration tests live in `check-rust.yml`; both gates are required
# by the npm release.

name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: ci-ts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build N-API addon
        run: node scripts/build/napi.mjs

      - name: Typecheck (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu typecheck

      - name: TypeScript tests (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu test

      - name: Build facade (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu build

      - name: Build AOT runtime (@doki-land/dejavu-engine)
        run: pnpm --filter @doki-land/dejavu-engine build

      - name: Build WASM bridge (@doki-land/dejavu-language)
        run: node scripts/build/wasm.mjs

      - name: Build WASM host package (@doki-land/dejavu-language)
        run: pnpm --filter @doki-land/dejavu-language build

      - name: IR conformance
        run: pnpm conformance

# Gate checks for dejavu-language.
# - push / PR on any branch → regular CI only (no publish)
# - release-npm / publish-docker / publish-artifacts call this via workflow_call on tag vX.Y.Z;
#   publish jobs only run after it succeeds.
# - On workflow_call, checkout is the caller's ref (the tagged commit).

name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build N-API addon
        run: node scripts/build/napi.mjs

      - name: Typecheck (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu typecheck

      - name: TypeScript tests (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu test

      - name: Build facade (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu build

      - name: IR conformance
        run: pnpm conformance

      - name: Rust workspace tests
        run: cargo test --workspace

# Gate checks for dejavu-language.
# - push / PR on any branch → regular CI only (no publish)
# - release-npm / publish-docker / publish-artifacts call this via workflow_call on tag vX.Y.Z;
#   publish jobs only run after it succeeds.
# - On workflow_call, checkout is the caller's ref (the tagged commit).

name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (@dejavu/engine, excludes legacy)
        run: pnpm --filter @dejavu/engine typecheck

      - name: TypeScript tests
        run: pnpm --filter @dejavu/engine test

      - name: IR conformance
        run: pnpm conformance

      - name: Publish bundle smoke (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu run build:publish

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/dejavu.rs -> target

      - name: Build Rust dejavu CLI
        run: |
          set -euo pipefail
          cargo build --release \
            --manifest-path projects/dejavu.rs/Cargo.toml \
            -p dejavu-tools \
            --bin dejavu
          ./projects/dejavu.rs/target/release/dejavu --help

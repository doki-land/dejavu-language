# Gate checks for dejavu-language.
# - push / PR to `dev` → run this workflow
# - release-npm / publish-docker / publish-artifacts call this via workflow_call;
#   publish jobs only run after it succeeds

name: ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        if: github.event_name != 'workflow_call'
        uses: actions/checkout@v4

      # Publish workflows call this; build always from this repo's `dev`.
      - name: Checkout dev
        if: github.event_name == 'workflow_call'
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript tests
        run: pnpm --filter @dejavu/engine test

      - name: IR conformance
        run: pnpm conformance

      - name: Publish bundle smoke (@doki-land/dejavu)
        run: pnpm --filter @doki-land/dejavu run build:publish

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/dejavu.rs -> target

      - name: Build Rust dejavu CLI
        run: |
          set -euo pipefail
          cargo build --release \
            --manifest-path projects/dejavu.rs/Cargo.toml \
            -p dejavu-tools \
            --bin dejavu
          ./projects/dejavu.rs/target/release/dejavu --help
